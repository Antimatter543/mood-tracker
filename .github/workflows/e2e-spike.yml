name: E2E spike (emulator + Maestro)

# Lane F SPIKE, go/no-go (ops plan: routes/soulsync/research/testing-conversion-plan.md, Lane F
# step 1). One question: can a QA APK built on a FREE GitHub runner boot on an emulator and pass
# one Maestro flow in under ~35 min, green 3 of 3? The full e2e.yml (smoke set, triggers, release
# gate) is written only after the verdict; this file is the measurement rig, not that workflow.
#
# Security shape (public repo):
#   - workflow_dispatch ONLY: owner-triggered, so a fork PR has no path to a runner.
#   - NO repo secrets anywhere. The APK is signed with a keystore GENERATED in the job (debug-style,
#     public password), so it is installable but can never be mistaken for, or update over, a
#     release build. It is uploaded as a short-lived run artifact only, never a release asset.
#   - permissions: contents: read. Every action pinned to a full commit SHA (tag in the comment).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-spike-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      build_s: ${{ steps.apk.outputs.build_s }}
      gradle_s: ${{ steps.apk.outputs.gradle_s }}
      apk_bytes: ${{ steps.apk.outputs.apk_bytes }}
    defaults:
      run:
        working-directory: frontend
    env:
      # The QA flag lane G will hang the seed channel off. Inert today; set so the spike measures
      # the same build command the full lane will run.
      EXPO_PUBLIC_QA: '1'
    steps:
      - name: Start timer
        working-directory: .
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # The Expo prebuild ships its own wrapper; don't fail on its checksum.
          validate-wrappers: false
          # setup-gradle defaults to read-only caching off the default branch. The spike WRITES so
          # runs 2-3 measure the warm-cache build that steady-state main pushes will see.
          cache-read-only: false

      - run: npm ci

      - name: Prebuild (CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Generate a throwaway signing keystore (no repo secrets)
        working-directory: .
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/qa.keystore" -storepass android \
            -alias qa -keypass android -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=SoulSync QA (CI throwaway),O=QA,C=US" -noprompt

      - name: assembleRelease (x86_64 only)
        working-directory: frontend/android
        # -PreactNativeArchitectures overrides the gradle.properties value withReleaseAbis.js writes
        # (arm-only), so the plugin stays untouched and only this QA build carries x86_64.
        run: |
          T=$(date +%s)
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/qa.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=qa \
            -Pandroid.injected.signing.key.password=android \
            --no-daemon
          echo "GRADLE_S=$(( $(date +%s) - T ))" >> "$GITHUB_ENV"

      - name: Locate APK, assert x86_64, record size
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$SRC" ] || { echo "::error::no release APK found"; exit 1; }
          cp "$SRC" "$RUNNER_TEMP/soulsync-qa.apk"
          # Artifact-level proof the ABI override took: the emulator cannot load arm-only libs.
          LIBS=$(unzip -l "$SRC" | grep -o 'lib/[^/]*/' | sort -u | tr '\n' ' ')
          echo "native lib dirs: $LIBS"
          echo "$LIBS" | grep -q 'lib/x86_64/' || { echo "::error::APK has no lib/x86_64"; exit 1; }
          if echo "$LIBS" | grep -q 'lib/arm'; then echo "::error::APK still carries arm libs"; exit 1; fi
          BYTES=$(stat -c%s "$SRC")
          echo "$BYTES" > "$RUNNER_TEMP/apk-size.txt"
          {
            echo "apk_bytes=$BYTES"
            echo "gradle_s=$GRADLE_S"
            echo "build_s=$(( $(date +%s) - JOB_T0 ))"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soulsync-qa-apk
          path: |
            ${{ runner.temp }}/soulsync-qa.apk
            ${{ runner.temp }}/apk-size.txt
          if-no-files-found: error
          retention-days: 3

  emulator-maestro:
    needs: build-qa-apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SPIKE_OUT: e2e-spike-out
      # Pinned by version AND checksum: the zip is fetched straight from the GitHub release (no
      # curl|bash installer). sha256 is the release asset's published digest.
      MAESTRO_VERSION: '2.12.1'
      MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
    steps:
      - name: Start timer
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soulsync-qa-apk
          path: qa-apk

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Maestro ${{ env.MAESTRO_VERSION }} (pinned + checksum)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/maestro/bin/maestro" --version

      # Per android-emulator-runner's README: without this the emulator cannot open /dev/kvm on
      # the ubuntu runners and falls back to software emulation (unusably slow).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mark emulator step start
        run: echo "EMU_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Emulator + Maestro (API 34 x86_64 google_apis)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A real phone geometry (1080x2160 @ 440dpi, the bench Pixel 3), not the tiny default skin,
          # so screenshots are meaningful golden candidates and the tab bar lays out as on device.
          profile: pixel_3
          cores: 3
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/e2e-spike.sh qa-apk/soulsync-qa.apk

      - name: Summary
        if: always()
        env:
          BUILD_S: ${{ needs.build-qa-apk.outputs.build_s }}
          GRADLE_S: ${{ needs.build-qa-apk.outputs.gradle_s }}
          APK_BYTES: ${{ needs.build-qa-apk.outputs.apk_bytes }}
        run: |
          f="$SPIKE_OUT/result.env"
          get() { sed -n "s/^$1=//p" "$f" 2>/dev/null | tail -1; }
          emu_job=$(( $(date +%s) - JOB_T0 ))
          total=$(( ${BUILD_S:-0} + emu_job ))
          m() { [ -n "$1" ] && awk -v s="$1" 'BEGIN{printf "%.1f", s/60}' || echo n/a; }
          {
            echo "## E2E spike"
            echo
            echo "| build job | gradle | boot* | install | flow | emulator job | total (jobs) | APK | result |"
            echo "|---|---|---|---|---|---|---|---|---|"
            echo "| $(m "$BUILD_S") min | $(m "$GRADLE_S") min | $(m "$(get BOOT_S)") min | $(get INSTALL_S)s | $(get FLOW_S)s | $(m "$emu_job") min | $(m "$total") min | $(( ${APK_BYTES:-0} / 1048576 )) MB | $(get RESULT) |"
            echo
            echo "*boot = emulator-step start to adb-ready, includes system-image download + AVD creation."
            echo
            echo "| measurement | value |"
            echo "|---|---|"
            for k in FLOW_RESULT HOME_AB_BYTE_IDENTICAL HOME_A_MD5 ASSERT_SAME_RC ASSERT_DIFF_RC DIFF_IMAGES CLOCK_AFTER_PIN CLOCK_AT_END DEVICE_TZ SCREEN REASON; do
              echo "| $k | $(get "$k") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots, logcat, Maestro output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-spike-out
          path: e2e-spike-out/
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14
