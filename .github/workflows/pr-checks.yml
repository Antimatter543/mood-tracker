name: PR checks

# Runs the same gates as a release (tsc + jest) on every pull request.
# Deliberately `pull_request`, never `pull_request_target`: fork code must not see secrets.
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pr-checks.yml'
  # Manual run on any ref. `scripts/release.sh` needs a green run on the exact tree it releases.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Several tests assert local-day behaviour for Brisbane (UTC+10); GitHub runners default to UTC.
      TZ: Australia/Brisbane
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --silent --ci
