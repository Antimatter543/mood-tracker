appId: com.raeduslabs.soulsyncapp
---
# SoulSync device tour — deterministic screenshot walk of the new features.
# Tabs are tapped by their testID (`id: tab-*`, lib/tabTestIds.ts): the tab-bar
# labels are not exposed to Maestro (react-navigation).
# Screen content (headers, buttons) IS exposed, so those use text matchers.
# Run from ~/Pictures/screenshots so the PNGs land there. No clearState =>
# seeded sample data stays visible.

- launchApp
# Dismiss the expo-dev-client developer menu if it appears.
- tapOn:
    text: "Continue"
    optional: true

- assertVisible:
    text: "Good (morning|afternoon|evening)"
- takeScreenshot: ss-home

# ─── Statistics (tab 2) ──────────────────────────────────────────────────────
- tapOn:
    id: tab-stats
- assertVisible:
    text: "Overview"
- takeScreenshot: ss-stats-month
- tapOn:
    text: "All Time"
- takeScreenshot: ss-stats-alltime

# ─── Insights (tab 4) — replaces the old fake Social tab ─────────────────────
- tapOn:
    id: tab-insights
- assertVisible:
    text: "What your entries say about you"
- takeScreenshot: ss-insights

# ─── Settings (tab 5) + Reminders ────────────────────────────────────────────
- tapOn:
    id: tab-settings
- assertVisible:
    text: "Appearance & Behavior"
- takeScreenshot: ss-settings
# The single "Daily Reminder" switch became a LIST of custom reminders, so
# anchor on the section header + the always-present Add control rather than on a
# row label (row labels are user-editable, and an upgraded user's migrated row is
# named "Daily reminder" while a fresh install may have none at all).
- scrollUntilVisible:
    element:
      text: "Reminders"
    direction: DOWN
- assertVisible:
    text: "Add reminder"
- takeScreenshot: ss-reminders

# ─── Entry form + photo attachment ───────────────────────────────────────────
- tapOn:
    id: tab-home
# FAB — target its accessibility label (point taps were unreliable).
- tapOn:
    text: "Add mood entry"
- assertVisible:
    text: "How were you?"
- takeScreenshot: ss-entry-mood
- tapOn:
    text: "Continue"
- assertVisible:
    text: "Photos"
- takeScreenshot: ss-entry-details
- tapOn:
    text: "Choose photo from library"
- takeScreenshot: ss-photo-picker
