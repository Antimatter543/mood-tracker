appId: com.raeduslabs.soulsyncapp
---
# The entry form's details step, and the activity grid. Guards 0374bee: long seeded
# names ("Unmotivated" in group 1) broke mid-word in a chip. Runs on both nav configs:
# the form owns its bottom inset (floating save button).
- runFlow:
    file: ../smoke/subflows/launch.yaml
    env:
      SCENARIO: week
- runFlow:
    file: subflows/settle.yaml
- tapOn:
    id: tab-home
- tapOn: "Add mood entry"
- assertVisible: "How were you\\?"
- tapOn: "Continue"
- waitForAnimationToEnd
- takeScreenshot: entry-form-details
# Scroll end positions are not pixel-stable, so this shot is cropped to the element:
# what is compared is the card itself, wherever the scroll happened to stop.
- scrollUntilVisible:
    element:
      id: activity-grid-1
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot:
    path: activity-grid-long-names
    cropOn:
      id: activity-grid-1
