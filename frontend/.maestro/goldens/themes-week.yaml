appId: com.raeduslabs.soulsyncapp
---
# Seeded Home on the light theme, and Settings on Forest (the AA contrast fix: a
# colour token change no render test can see).
- runFlow:
    file: ../smoke/subflows/launch.yaml
    env:
      SCENARIO: week
- runFlow:
    file: subflows/settle.yaml
- runFlow:
    file: subflows/set-theme.yaml
    env:
      THEME: light
- tapOn:
    id: tab-home
- runFlow:
    file: subflows/hold.yaml
- takeScreenshot: home-week-light
- runFlow:
    file: subflows/set-theme.yaml
    env:
      THEME: forest
- runFlow:
    file: subflows/hold.yaml
- takeScreenshot: settings-forest
