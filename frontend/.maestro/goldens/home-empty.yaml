appId: com.raeduslabs.soulsyncapp
---
# Home with no entries, dark and light: the first screen a new user sees.
- runFlow:
    file: ../smoke/subflows/launch.yaml
    env:
      SCENARIO: empty
- runFlow:
    file: subflows/settle.yaml
- runFlow:
    file: subflows/hold.yaml
- takeScreenshot: home-empty-dark
- runFlow:
    file: subflows/set-theme.yaml
    env:
      THEME: light
- tapOn:
    id: tab-home
- runFlow:
    file: subflows/hold.yaml
- takeScreenshot: home-empty-light
