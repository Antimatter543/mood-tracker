appId: com.raeduslabs.soulsyncapp
---
# Time of Day with every entry in one part of the day. Guards bd4d82d: the card read
# "best in the Morning and toughest at Morning". With the clock frozen, an entry added
# through the UI lands at the one instant, so there is exactly one bucket.
- runFlow:
    file: ../smoke/subflows/launch.yaml
    env:
      SCENARIO: empty
- runFlow:
    file: subflows/settle.yaml
- runFlow:
    file: ../smoke/subflows/add-entry.yaml
    env:
      NOTE: golden-one-bucket
- tapOn:
    id: tab-stats
# Scroll end positions are not pixel-stable, so this shot is cropped to the element:
# what is compared is the card itself, wherever the scroll happened to stop.
- scrollUntilVisible:
    element:
      id: time-of-day-card
    direction: DOWN
    centerElement: true
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot:
    path: time-of-day-one-bucket
    cropOn:
      id: time-of-day-card
