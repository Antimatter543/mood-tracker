appId: com.raeduslabs.soulsyncapp
---
# Subflow: log ONE mood entry through the real UI, starting from any tab.
# The mood stays at the form's default (5.0, useEntryDraft); the note is ${NOTE},
# which later steps find the entry by.
#
# TODO(lane G seed): once the QA seed deep link is on main, flows that only need
# data to EXIST (03, 04, 05) should open
#   myapp://qa/seed?scenario=<name>&now=2026-11-03T10:00:00
# instead of typing entries here. 02 keeps this subflow: adding an entry IS what
# it tests.
- tapOn:
    id: tab-home
- tapOn: "Add mood entry"
- assertVisible: "How were you\\?"
- tapOn: "Continue"
- tapOn:
    id: entry-notes-input
- inputText: ${NOTE}
- hideKeyboard
# The form shows EITHER the inline Back/Submit row OR, while that row is scrolled
# out of view, the floating save button (EntryForm `buttonsVisible`). Tap
# whichever one is on screen, exactly once.
- runFlow:
    when:
      visible:
        id: entry-form-floating-save
    commands:
      - tapOn:
          id: entry-form-floating-save
- runFlow:
    when:
      visible: "Submit"
    commands:
      - tapOn: "Submit"
- extendedWaitUntil:
    notVisible:
      id: entry-notes-input
    timeout: 10000
