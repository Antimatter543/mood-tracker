appId: com.raeduslabs.soulsyncapp
---
# e2e SPIKE flow (.github/workflows/e2e-spike.yml). The go/no-go question is only "does a QA APK
# built on a free runner boot on an emulator and pass one Maestro flow"; the real smoke set is
# full Lane F's job. Fresh install, so the DB is empty and Home shows the time-of-day greeting.
# The harness pins the emulator clock to 10:00, so the greeting is "Good morning" on every run;
# the regex stays wide so a clock-pin failure is reported by the golden comparison, not here.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      text: "Good (morning|afternoon|evening)"
    timeout: 90000
- assertVisible:
    text: "Good (morning|afternoon|evening)"
- waitForAnimationToEnd:
    timeout: 5000
# Two captures of the same screen a few seconds apart: the within-run stability sample.
# Cross-run stability compares home-a between two runs' artifacts.
- takeScreenshot: home-a
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: home-b
