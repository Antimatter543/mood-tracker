appId: com.raeduslabs.soulsyncapp
---
# SPIKE measurement, negative control: open the entry form (a visibly different screen), then
# assertScreenshot against the Home reference. Expected: FAIL. The harness then looks for any
# diff image Maestro wrote (the plan marks "does assertScreenshot write a diff" as unverified).
- tapOn:
    text: "Add mood entry"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: entry-form
- assertScreenshot:
    path: ref/home-ref.png
    thresholdPercentage: 99.9
